# iOS: build for the iPhone Simulator on a GitHub macOS (Apple silicon) runner, launch, screenshot.
# THROWAWAY branch ci/revenuecat-iphone: demo build + RevenueCat Test Store (secret VITE_REVENUECAT_TEST_KEY).
# Pass 1 buys yearly through the paywall's buy(); pass 2 opens the Customer Center (src/dev/ciRevenueCat.js).
name: iOS simulator

on:
  workflow_dispatch:
  push:
    branches: [ci/revenuecat-iphone]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://demo.invalid
  VITE_SUPABASE_ANON_KEY: demo
  VITE_DEMO: '1'
  VITE_DEMO_PARAMS: limits=1&paywall=settings
  VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_TEST_KEY }}

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Web build (pass 1, buy) + cap sync ios
        env:
          VITE_CI_RC: buy
        run: npx vite build --mode native && npx cap sync ios

      - name: Build for the iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Boot a simulator and install
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          phones = [d for d in devs if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] or devs
          print(phones[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app

      - name: Install AXe
        run: brew install cameroncooke/axe/axe

      - name: Pass 1 - Test Store purchase
        run: python3 scripts/ios-rc-check.py buy

      - name: Pass 2 - Customer Center (same native app, new web assets)
        env:
          VITE_CI_RC: cc
          VITE_DEMO_PARAMS: limits=1
        run: |
          npx vite build --mode native
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          rm -rf "$APP/public" && cp -R dist "$APP/public"
          xcrun simctl terminate "$UDID" com.sillytraveltool.app || true
          xcrun simctl install "$UDID" "$APP"
          python3 scripts/ios-rc-check.py cc

      - name: App log
        if: always()
        run: |
          mkdir -p shots
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "App" AND (eventMessage CONTAINS "⚡️" OR eventMessage CONTAINS "[ci-rc]" OR eventMessage CONTAINS "Purchases" OR eventMessage CONTAINS[c] "error")' \
            2>/dev/null | grep -v -i "token\|WebPrivacy\|ResourceLoadStatistics" | tail -300 > shots/js.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-revenuecat-shots
          path: shots
          retention-days: 3
