# Supabase CLI config for project swywrvbuswylvqlktsym (us-east-2).
# Link once with: supabase link --project-ref swywrvbuswylvqlktsym
project_id = "silly-travel-tool"

# JWT verification at the gateway is OFF for every function, matching what
# is live. Each function authenticates itself instead:
#   - user-facing functions call auth.getUser() on the bearer token
#   - receive-booking-email verifies the Resend (Svix) webhook signature
# Locked here so a CLI deploy can't silently flip the setting.

[functions.accept-invite]
verify_jwt = false

[functions.check-badges]
verify_jwt = false

