<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Free AI Travel Planner — City Guides, Booking Tracker, Real-Time Discovery</title>
    <meta name="description" content="Plan trips, track bookings, discover hidden spots and get AI-powered travel guides for any city in the world. Free travel planner PWA — no app store needed." />
    <meta name="keywords" content="travel planner, trip organizer, AI travel guide, city guide, travel companion, packing list, flight tracker, hotel organizer" />
    <meta name="author" content="Babar Ali" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Canonical -->
    <link rel="canonical" href="https://sillytraveltool.com" />

    <!-- Google Fonts — preconnect for non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sillytraveltool.com" />
    <meta property="og:title" content="Silly Travel Tool — Trust The Goose. It knows a spot." />
    <meta property="og:description" content="AI-powered travel planner. Plan trips, import bookings, get city guides, and let The Goose find you somewhere great right now." />
    <meta property="og:image" content="https://sillytraveltool.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Silly Travel Tool" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Silly Travel Tool — Trust The Goose." />
    <meta name="twitter:description" content="AI travel companion. City guides, booking tracker, real-time discovery. Free PWA." />
    <meta name="twitter:image" content="https://sillytraveltool.com/og-image.png" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#C4561E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Silly Travel Tool" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Silly Travel Tool",
      "url": "https://sillytraveltool.com",
      "description": "AI-powered travel planner and city guide. Plan trips, track bookings, discover places with The Goose.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI city guides powered by Gemini",
        "Flight and hotel booking tracker",
        "Email booking import",
        "Real-time local discovery (HONK)",
        "Live weather forecasts",
        "Currency converter",
        "Packing checklist generator",
        "Emergency SOS numbers for 30+ countries",
        "Phrasebook for any language"
      ],
      "author": {
        "@type": "Person",
        "name": "Babar Ali"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
