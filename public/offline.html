<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Silly Travel Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* Clay tokens (static page: values copied from src/styles/tokens.css) */
    :root { --page: #F4EEE6; --card: #FFFDF9; --ink: #2A2520; --ink-secondary: #5A5247; --accent-fill: #B24A17; --on-accent: #FFFDF9; --tile: #FFFDF9; }
    @media (prefers-color-scheme: dark) { :root { --page: #1C1814; --card: #28221C; --ink: #F4EEE6; --ink-secondary: #D6CBBD; --tile: #F4EEE6; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--page); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .container { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .tile { width: 132px; height: 132px; border-radius: 44px; background: var(--tile); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(120,80,50,0.10), inset 0 -4px 0 rgba(120,80,50,0.06); }
    h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; letter-spacing: -0.01em; }
    p { font-size: 16px; color: var(--ink-secondary); line-height: 1.5; }
    button { height: 54px; width: 100%; border: 0; border-radius: 18px; background: var(--accent-fill); color: var(--on-accent); font: 600 16px 'DM Sans', system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 14px rgba(178,74,23,0.28), inset 0 -3px 0 rgba(0,0,0,0.12); margin-top: 8px; }
  </style>
</head>
<body>
  <main class="container">
    <div class="tile">
      <svg width="96" height="96" viewBox="-16 -14 132 132" fill="none" aria-hidden="true">
        <ellipse cx="4" cy="70" rx="14" ry="20" fill="#E8E3DB" stroke="#2A2520" stroke-width="4" transform="rotate(-32 4 70)"/>
        <ellipse cx="96" cy="70" rx="14" ry="20" fill="#E8E3DB" stroke="#2A2520" stroke-width="4" transform="rotate(32 96 70)"/>
        <path d="M33 60 Q29 78 27 100 L73 100 Q71 78 67 60 Q59 67 50 67 Q41 67 33 60Z" fill="#F0EBE3" stroke="#2A2520" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="50" cy="35" r="28" fill="#F0EBE3" stroke="#2A2520" stroke-width="4"/>
        <path d="M31 30 Q39 35 47 30" stroke="#2A2520" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M39 51 Q44 54 49 51" stroke="#2A2520" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M57 31 Q72 27 76 33 Q72 39 57 37Z" fill="#E8A820" stroke="#2A2520" stroke-width="3" stroke-linejoin="round"/>
        <path d="M57 37 Q70 37 74 42 Q68 47 57 41Z" fill="#D4910A" stroke="#2A2520" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Goose is offline</h1>
    <p>No connection right now. Trips you've opened recently are still saved on this device.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
